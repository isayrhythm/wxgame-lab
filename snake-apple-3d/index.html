<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>贪吃蛇吃苹果</title>
    <link rel="stylesheet" href="../shared/game-ui.css?v=2026061001" />
    <link rel="stylesheet" href="./style.css?v=2026062002" />
  </head>
  <body>
    <main class="game-shell" aria-label="贪吃蛇吃苹果小游戏">
      <canvas id="gameCanvas" aria-label="3D 游戏画面"></canvas>

      <a class="home-link" href="../" aria-label="返回小游戏大厅">‹</a>
      <button id="pauseButton" class="pause-button" type="button" aria-label="暂停">Ⅱ</button>

      <section class="hud" aria-live="polite">
        <div class="pill apple-pill">
          <span class="apple-dot"></span>
          <span id="appleCount">0</span>
        </div>
        <div class="pill length-pill">
          <span class="snake-dot"></span>
          <span id="lengthCount">4</span>
        </div>
        <div id="buffStatus" class="buff-status" aria-label="Buff 状态"></div>
      </section>

      <section id="overlay" class="overlay">
        <div class="panel">
          <p class="kicker">3D 贪吃蛇</p>
          <h1>贪吃蛇吃苹果</h1>
          <p class="hint">拖动或用方向键控制蛇，在峡谷三路吃苹果，也能进野区吃野怪。蓝 buff 提速，红 buff 会让苹果大量掉落。</p>
          <button id="primaryButton" type="button">开始</button>
        </div>
      </section>
    </main>
    <script src="../shared/game-ui.js?v=2026061001"></script>
    <script src="../shared/vendor/three-0.160.0.min.js"></script>
    <script src="./game.js?v=2026062115"></script>
  </body>
</html>
