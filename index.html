<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>小游戏大厅</title>
    <link rel="stylesheet" href="./portal.css?v=2026061001" />
  </head>
  <body>
    <main class="portal">
      <section class="topbar">
        <p>WXGAME</p>
        <h1>小游戏大厅</h1>
      </section>

      <section class="game-list" aria-label="游戏列表">
        <a class="game-card wood" href="./wood-runner/">
          <span class="scene">
            <span class="track"></span>
            <span class="runner"></span>
            <span class="planks"></span>
          </span>
          <span class="copy">
            <strong>木板冲刺</strong>
            <small>收木板、过倍率门、自动铺桥</small>
          </span>
        </a>

        <a class="game-card shooter" href="./shooter/">
          <span class="scene">
            <span class="monster-cloud"></span>
            <span class="gate left">x2</span>
            <span class="gate right">+3</span>
            <span class="squad">👬👬</span>
          </span>
          <span class="copy">
            <strong>企鹅打枪</strong>
            <small>企鹅小队吃补给，集火击退虫潮</small>
          </span>
        </a>
      </section>
    </main>
  </body>
</html>
