<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>小游戏大厅</title>
    <link rel="stylesheet" href="./portal.css?v=2026062001" />
  </head>
  <body>
    <main class="portal">
      <a class="github-link" href="https://github.com/isayrhythm/wxgame-lab" target="_blank" rel="noopener noreferrer" aria-label="打开 GitHub 仓库">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .5C5.73.5.77 5.58.77 11.98c0 5.08 3.2 9.39 7.63 10.91.56.1.76-.25.76-.55v-2.02c-3.1.69-3.76-1.52-3.76-1.52-.51-1.32-1.24-1.67-1.24-1.67-1.01-.71.08-.7.08-.7 1.12.08 1.71 1.18 1.71 1.18.99 1.73 2.6 1.23 3.24.94.1-.74.39-1.23.71-1.52-2.48-.29-5.09-1.27-5.09-5.65 0-1.25.44-2.27 1.15-3.07-.12-.29-.5-1.46.11-3.03 0 0 .94-.31 3.08 1.17A10.47 10.47 0 0 1 12 5.57c.95 0 1.91.13 2.81.38 2.14-1.48 3.08-1.17 3.08-1.17.61 1.57.23 2.74.11 3.03.72.8 1.15 1.82 1.15 3.07 0 4.39-2.61 5.35-5.1 5.64.4.35.76 1.05.76 2.12v3.15c0 .31.2.66.77.55a11.51 11.51 0 0 0 7.64-10.9C23.23 5.58 18.27.5 12 .5Z" />
        </svg>
      </a>
      <section class="topbar">
        <p>WXGAME</p>
        <h1>小游戏大厅</h1>
      </section>

      <section class="game-list" aria-label="游戏列表">
        <a class="game-card wood" href="./wood-runner/">
          <span class="scene">
            <span class="track"></span>
            <span class="runner"></span>
            <span class="planks"></span>
          </span>
          <span class="copy">
            <strong>木板冲刺</strong>
            <small>收木板、过倍率门、自动铺桥</small>
          </span>
        </a>

        <a class="game-card shooter" href="./shooter/">
          <span class="scene">
            <span class="monster-cloud"></span>
            <span class="gate left">x2</span>
            <span class="gate right">+3</span>
            <span class="squad">👬👬</span>
          </span>
          <span class="copy">
            <strong>企鹅打枪</strong>
            <small>企鹅小队吃补给，集火击退虫潮</small>
          </span>
        </a>

        <a class="game-card pig-charge" href="./pig-charge/">
          <span class="scene">
            <span class="pig-road"></span>
            <span class="pig-gate pig-left">数量+5</span>
            <span class="pig-gate pig-right">攻击x3</span>
            <span class="pig-pack">
              <span></span><span></span><span></span><span></span><span></span>
            </span>
          </span>
          <span class="copy">
            <strong>猪群突围</strong>
            <small>拖动猪群过数量门和攻击门，收金币，撞散守卫 Boss</small>
          </span>
        </a>

        <a class="game-card snake-apple" href="./snake-apple-3d/">
          <span class="scene">
            <span class="snake-skyline"></span>
            <span class="snake-field"></span>
            <span class="snake-windmill"></span>
            <span class="snake-body"><span></span><span></span><span></span><span></span></span>
            <span class="snake-apple-preview"></span>
            <span class="snake-gold-preview"></span>
          </span>
          <span class="copy">
            <strong>贪吃蛇吃苹果</strong>
            <small>在峡谷三路操控小蛇吃苹果，进野区拿蓝红 buff</small>
          </span>
        </a>
      </section>
    </main>
  </body>
</html>
