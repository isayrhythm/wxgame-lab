<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>猪群突围</title>
    <link rel="stylesheet" href="../shared/game-ui.css?v=2026061001" />
    <link rel="stylesheet" href="./style.css?v=2026061701" />
  </head>
  <body>
    <main class="game-shell" aria-label="猪群突围小游戏">
      <canvas id="gameCanvas" aria-label="游戏画面"></canvas>

      <a class="home-link" href="../" aria-label="返回小游戏大厅">‹</a>
      <button id="pauseButton" class="pause-button" type="button" aria-label="暂停">Ⅱ</button>

      <section class="hud" aria-live="polite">
        <div class="pill monster-pill">
          <span class="monster-dot"></span>
          <span id="monsterCount">0</span>
        </div>
        <div class="pill squad-pill">
          <span class="squad-dot"></span>
          <span id="squadCount">1</span>
        </div>
      </section>

      <section id="overlay" class="overlay">
        <div class="panel">
          <p class="kicker">猪群跑道冲锋</p>
          <h1>猪群突围</h1>
          <p class="hint">拖动蓝色摇杆带猪群冲刺，过数量门和攻击门，收金币，撞散守卫和 Boss。</p>
          <button id="primaryButton" type="button">开始冲锋</button>
        </div>
      </section>
    </main>
    <script src="../shared/game-ui.js?v=2026061001"></script>
    <script src="../shared/vendor/phaser-3.90.0.min.js"></script>
    <script src="./game.js?v=2026061826"></script>
  </body>
</html>
